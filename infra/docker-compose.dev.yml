version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: ant-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ant
    ports:
      - "5432:5432"
    volumes:
      - ant_postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: ant-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ant_minio_data:/data

volumes:
  ant_postgres_data:
  ant_minio_data:
